AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "Life efficiency endpoints!"
Globals:
  Function:
    Timeout: 60
    Runtime: python3.14
    Tracing: Active
    Environment:
      Variables:
        LOG_LEVEL: INFO
        POWERTOOLS_LOGGER_SAMPLE_RATE: 0.1
        POWERTOOLS_LOGGER_LOG_EVENT: true
        POWERTOOLS_METRICS_NAMESPACE: MyServerlessApplication
        POWERTOOLS_SERVICE_NAME: hello
Mappings:
  EnvironmentMap:
    Dev:
      Lower: dev
    Prod:
      Lower: prod
Parameters:
  Environment:
    Type: String
    Default: Dev
    AllowedValues:
      - Dev
      - Prod

Conditions:
  TelegramEventsEnabled: !Equals [!Ref Environment, Dev]

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub
        - "leon-patmore-life-efficiency-${LowerEnvironment}"
        - LowerEnvironment: !FindInMap [EnvironmentMap, !Ref Environment, "Lower"]
  ShoppingListTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: !Sub "life-efficiency_${Environment}_shopping-list"
  RepeatingItemsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: !Sub "life-efficiency_${Environment}_repeating-items"
  ShoppingHistoryTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: !Sub "life-efficiency_${Environment}_shopping-history"
  GoalsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: !Sub "life-efficiency_${Environment}_goals"
  WeeklyTodosTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: !Sub "life-efficiency_${Environment}_weekly-todos"
  TodoListTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: !Sub "life-efficiency_${Environment}_todo-list"
  TodoSetTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: !Sub "life-efficiency_${Environment}_todo-sets"
  FinanceBalanceInstances:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: !Sub "life-efficiency_${Environment}_balance_instances"
  FinanceBalanceChanges:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: !Sub "life-efficiency_${Environment}_balance_changes"
  ShoppingItemIgnore:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "life-efficiency_${Environment}_shopping_item_ignore"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl
      KeySchema:
        - AttributeName: id
          KeyType: HASH
  TelegramEnvSecret:
    Type: AWS::SecretsManager::Secret
    Condition: TelegramEventsEnabled
    Properties:
      Name: !Sub "life-efficiency/${Environment}/telegram-env"
      Description: "Key/value env vars for TelegramCheckFunction"
      SecretString: "{}"
  LifeEfficiencyFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: configuration.handler
      CodeUri: life-efficiency
      Description: Function for life efficiency
      Environment:
        Variables:
          ENV: !Sub "${Environment}"
          S3_BUCKET_NAME: !Ref Bucket
          MPLCONFIGDIR: /tmp
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref Bucket
        - DynamoDBCrudPolicy:
            TableName: !Sub "life-efficiency_${Environment}_shopping-list"
        - DynamoDBCrudPolicy:
            TableName: !Sub "life-efficiency_${Environment}_repeating-items"
        - DynamoDBCrudPolicy:
            TableName: !Sub "life-efficiency_${Environment}_shopping-history"
        - DynamoDBCrudPolicy:
            TableName: !Sub "life-efficiency_${Environment}_goals"
        - DynamoDBCrudPolicy:
            TableName: !Sub "life-efficiency_${Environment}_weekly-todos"
        - DynamoDBCrudPolicy:
            TableName: !Sub "life-efficiency_${Environment}_todo-list"
        - DynamoDBCrudPolicy:
            TableName: !Sub "life-efficiency_${Environment}_todo-sets"
        - DynamoDBCrudPolicy:
            TableName: !Sub "life-efficiency_${Environment}_balance_instances"
        - DynamoDBCrudPolicy:
            TableName: !Sub "life-efficiency_${Environment}_balance_changes"
        - DynamoDBCrudPolicy:
            TableName: !Sub "life-efficiency_${Environment}_shopping_item_ignore"
      Events:
        CatchAll:
          Type: Api
          Properties:
            Path: /{command}/{subcommand+}
            Method: any
            RestApiId: !Ref Api
  TelegramCheckFunction:
    Type: AWS::Serverless::Function
    Condition: TelegramEventsEnabled
    Properties:
      Handler: telegram.handler.handler
      CodeUri: life-efficiency
      Description: Check Telegram chat for stale replies every 15 minutes
      Timeout: 60
      MemorySize: 1024
      Layers:
        - "arn:aws:lambda:eu-west-1:015030872274:layer:AWS-Parameters-and-Secrets-Lambda-Extension:63"
      Environment:
        Variables:
          TELEGRAM_SECRET_ARN: !Ref TelegramEnvSecret
          AWS_ENDPOINT_URL: ""
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref TelegramEnvSecret
      Events:
        EveryFifteenMinutes:
          Type: Schedule
          Properties:
            # EventBridge cron is evaluated in UTC. 11:00–23:59 MYT (UTC+8) == 03:00–15:59 UTC.
            Schedule: cron(0/15 3-15 ? * * *)
            Description: Run Telegram reply check every 15 minutes during 11am-11pm MYT
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
